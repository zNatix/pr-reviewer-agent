name: Missed Finding Report
description: Report a finding that the PR reviewer agent failed to detect
labels: [missed-finding]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: Short summary of the missed finding
      placeholder: e.g., "Missing null check in public API"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed description of what should have been flagged
      placeholder: Describe the issue that was overlooked...
    validations:
      required: true

  - type: dropdown
    id: instruction-file
    attributes:
      label: Instruction File
      description: Which instruction file should have caught this?
      options:
        - supply-chain.instructions.md
        - github-actions.instructions.md
        - api-design.instructions.md
        - security-warnings.instructions.md
        - security-injection.instructions.md
        - security-auth.instructions.md
        - review-output.instructions.md
        - reqnroll.instructions.md
        - playwright-base.instructions.md
        - playwright-anti-patterns.instructions.md
        - playwright-actions.instructions.md
        - performance-warnings.instructions.md
        - performance-critical.instructions.md
        - nunit.instructions.md
        - logging.instructions.md
        - gherkin.instructions.md
        - efcore.instructions.md
        - di.instructions.md
        - architecture-patterns.instructions.md
        - architecture-core.instructions.md
        - appium-locators.instructions.md
        - appium-lifecycle.instructions.md
        - appium-gestures.instructions.md
        - Other / Not sure
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: What severity should this finding have?
      options:
        - Critical
        - Warning
        - Suggestion
    validations:
      required: true

  - type: textarea
    id: example-code
    attributes:
      label: Example Code
      description: The code snippet that should have been flagged
      render: csharp
    validations:
      required: true

  - type: textarea
    id: why-flagged
    attributes:
      label: Why It Should Be Flagged
      description: Explain why this pattern is problematic and warrants a finding
      placeholder: e.g., "This violates the principle of..."
    validations:
      required: true
