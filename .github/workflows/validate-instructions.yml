name: Validate Instructions

on:
  pull_request:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/instructions/*.instructions.md'
      - '.github/agents/*.agent.md'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/labeler.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
      - 'README.md'
      - 'examples/**'
      - 'scripts/validate_copilot_config.py'
      - 'docs/**'
  push:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/instructions/*.instructions.md'
      - '.github/agents/*.agent.md'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/labeler.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
      - 'README.md'
      - 'examples/**'
      - 'scripts/validate_copilot_config.py'
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "pyyaml==6.0.2"

      - name: Validate frontmatter with YAML parser
        run: python scripts/validate_copilot_config.py --strict-warnings
