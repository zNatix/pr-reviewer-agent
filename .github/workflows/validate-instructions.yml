name: Validate Instructions

on:
  pull_request:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/instructions/*.instructions.md'
      - '.github/agents/*.agent.md'
      - '.github/workflows/*.yml'
      - 'README.md'
      - 'examples/**'
      - 'scripts/validate_copilot_config.py'
      - 'docs/**'
  push:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/instructions/*.instructions.md'
      - '.github/agents/*.agent.md'
      - '.github/workflows/*.yml'
      - 'README.md'
      - 'examples/**'
      - 'scripts/validate_copilot_config.py'
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "pyyaml==6.0.2"

      - name: Validate frontmatter with YAML parser
        run: python scripts/validate_copilot_config.py
