name: Validate Instructions

on:
  pull_request:
    paths:
      - '.github/instructions/*.instructions.md'
      - '.github/agents/*.agent.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate instruction file frontmatter
        run: |
          errors=0
          for f in .github/instructions/*.instructions.md; do
            echo "Checking $f"

            # Must have YAML frontmatter delimiters
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "  ERROR: missing opening ---"
              errors=$((errors+1))
              continue
            fi

            # Extract frontmatter (lines between first and second ---)
            fm=$(sed -n '2,/^---$/p' "$f" | head -n -1)

            # Required fields
            if ! echo "$fm" | grep -q 'applyTo:'; then
              echo "  ERROR: missing required field 'applyTo'"
              errors=$((errors+1))
            fi

            # Validate applyTo glob syntax (basic check)
            applyto=$(echo "$fm" | grep 'applyTo:' | head -1)
            # Check for unmatched brackets or quotes
            if echo "$applyto" | grep -q '\[.*[^\]]$'; then
              echo "  ERROR: applyTo array appears unclosed"
              errors=$((errors+1))
            fi

            echo "  OK"
          done

          if [ $errors -gt 0 ]; then
            echo "::error::$errors instruction file(s) have invalid frontmatter"
            exit 1
          fi
          echo "All instruction files validated."

      - name: Validate agent file frontmatter
        run: |
          errors=0
          for f in .github/agents/*.agent.md; do
            echo "Checking $f"

            if ! head -1 "$f" | grep -q '^---$'; then
              echo "  ERROR: missing opening ---"
              errors=$((errors+1))
              continue
            fi

            fm=$(sed -n '2,/^---$/p' "$f" | head -n -1)

            for field in name description model tools; do
              if ! echo "$fm" | grep -q "^$field:"; then
                echo "  ERROR: missing required field '$field'"
                errors=$((errors+1))
              fi
            done

            echo "  OK"
          done

          if [ $errors -gt 0 ]; then
            echo "::error::$errors issue(s) in agent file(s)"
            exit 1
          fi
          echo "All agent files validated."
