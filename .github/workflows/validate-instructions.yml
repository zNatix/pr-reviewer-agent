name: Validate Instructions

on:
  pull_request:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/instructions/*.instructions.md'
      - '.github/agents/*.agent.md'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/labeler.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
      - 'README.md'
      - 'examples/**'
      - 'scripts/validate_copilot_config.py'
      - 'scripts/validate_examples.py'
      - 'docs/**'
  push:
    paths:
      - '.github/copilot-instructions.md'
      - '.github/instructions/*.instructions.md'
      - '.github/agents/*.agent.md'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/labeler.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
      - 'README.md'
      - 'examples/**'
      - 'scripts/validate_copilot_config.py'
      - 'scripts/validate_examples.py'
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "pyyaml==6.0.2"

      - name: Validate frontmatter with YAML parser
        run: python scripts/validate_copilot_config.py --strict-warnings

      - name: Validate examples regression harness
        run: python scripts/validate_examples.py
