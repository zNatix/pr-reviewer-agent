# Skeleton workflow for automated Copilot Code Review on every PR
# 
# This workflow triggers Copilot Code Review automatically when a PR is opened
# or updated. It does NOT invoke the @pr-reviewer custom agent (that requires
# manual Chat invocation). It uses the instruction files in .github/instructions/
# to guide Copilot's automatic review.
#
# Prerequisites:
# 1. Enable Copilot Code Review in your repository settings
# 2. The .github/instructions/*.md files must exist on the base branch
